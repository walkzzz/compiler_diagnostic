name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Cangjie 1.1.3 (cjnative) SDK
        id: sdk
        shell: bash
        run: |
          if [ -n "${CANGJIE_HOME:-}" ]; then
            echo "using provided CANGJIE_HOME=$CANGJIE_HOME"
          elif [ -d "$GITHUB_WORKSPACE/cangjie-sdk-1.1.3/cangjie" ]; then
            echo "CANGJIE_HOME=$GITHUB_WORKSPACE/cangjie-sdk-1.1.3/cangjie" >> "$GITHUB_ENV"
          else
            echo "CANGJIE_HOME not set and vendored SDK absent; provide Cangjie 1.1.3 cjnative SDK." && exit 1
          fi

      - name: Build (warning-free)
        shell: bash
        run: |
          SDK="$CANGJIE_HOME"
          export PATH="$SDK/bin:$SDK/tools/bin:$SDK/tools/lib:$SDK/runtime/lib/windows_x86_64_cjnative:$PATH"
          rm -rf target
          cjpm build --jobs 1 2>&1 | tee build.log
          if grep -i "warning" build.log; then
            echo "::error::Build produced warnings (project requires warning = 0)"
            exit 1
          fi

      - name: Test (per-group, retry on flaky segfault)
        shell: bash
        run: |
          SDK="$CANGJIE_HOME"
          export PATH="$SDK/bin:$SDK/tools/bin:$SDK/tools/lib:$SDK/runtime/lib/windows_x86_64_cjnative:$PATH"
          bash tools/run_tests.sh all

      - name: cjlint gate (MANDATORY = 0)
        shell: bash
        run: |
          SDK="$CANGJIE_HOME"
          export PATH="$SDK/bin:$SDK/tools/bin:$SDK/tools/lib:$SDK/runtime/lib/windows_x86_64_cjnative:$PATH"
          # cjlint requires a real Windows path for CANGJIE_HOME
          export CANGJIE_HOME="$(cygpath -w "$SDK")"
          cjlint -f src -o cjlint.json
          python3 tools/cjlint_check.py cjlint.json

      - name: Coverage (best-effort)
        shell: bash
        continue-on-error: true
        run: |
          SDK="$CANGJIE_HOME"
          export PATH="$SDK/bin:$SDK/tools/bin:$SDK/tools/lib:$SDK/runtime/lib/windows_x86_64_cjnative:$PATH"
          cjpm test src/ut --coverage || true
          cjcov -r src -s src -o cov_out -x || true
          python3 tools/coverage_gate.py --root cov_out || true
