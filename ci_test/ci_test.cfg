[test-home]
dir = ../../test

[running]
temp_dir = ../test_temp/run

[logging]
name = ../test_temp/log
level = INFO

[test]
# 3rd_party_root 留空：本作品无第三方根依赖，由 CI 环境按需注入。
3rd_party_root =
3rd_party_root_ohos =
fuzz_lib =
fuzz_runs =
fuzz_rss_limit_mb =
compile_options = --test -Woff unused --dy-std
run_options = --no-progress
CJHEAPSIZE = 1GB

[cangjie-home]
OHOS_compile_option =
DEVECO_CANGJIE_HOME =
OHOS_ROOT =
OHOS_version =
# home 留空：SDK 位置由运行环境的环境变量 CANGJIE_HOME 提供（赛事标准做法），
# 避免硬编码本机/个人绝对路径导致可复现性失败。评委机须先 export CANGJIE_HOME=<SDK 根>。
home =
cjpm =
update_toml = true

[git-config]
username =
password =

[build-warning]
warning = 0
